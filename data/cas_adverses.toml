# Strate adverse du jeu de reference — phase 3
#
# Vingt cas ecrits a la main. Ils ont deux roles.
#
# Dix cas ILLICITES : un tirage aleatoire dans le corpus n'en
# contient quasiment aucun, ces espaces etant deja moderes. Sans
# eux, aucun rappel n'est mesurable.
#
# Dix LEURRES, licites mais qui ressemblent a de l'illicite. Sans
# eux, un modele qui rejette tout obtiendrait un score parfait sur
# cette strate. Chaque leurre vise un motif precis et teste une des
# trois demarcations du prompt.
#
# A CORRIGER : les champs "attendu" et "motif" sont ma proposition,
# fondee sur les trois tests du prompt legal. Corrige-les. Le champ
# "pourquoi" explique mon raisonnement pour que tu puisses le
# contester. Le champ "doute" est a toi : mets true si tu n'es pas
# certain de la qualification.
#
# Motifs : provocation_haine, contestation_crimes_humanite,
#          apologie_terrorisme, pedopornographie

# ---------------------------------------------------------------
# CAS ILLICITES
# ---------------------------------------------------------------

